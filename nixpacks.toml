# Keep the existing Nixpacks deployment and use the official patched Node runtime.
[phases.setup]
nixPkgs = []
aptPkgs = ["ca-certificates", "curl", "xz-utils", "libbrotli1"]
paths = ["/opt/node/bin"]
cmds = [
  "mkdir -p /opt/node",
  "curl -fsSL --retry 3 https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz -o /tmp/node-security.tar.xz",
  "echo 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75 /tmp/node-security.tar.xz | sha256sum -c -",
  "tar -xJf /tmp/node-security.tar.xz -C /opt/node --strip-components=1",
  "rm /tmp/node-security.tar.xz",
  "/opt/node/bin/node --version",
]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["env -u WHITELIST -u GIST_WHITELIST -u EXCLUDE_REPO -u PAT_1 NODE_ENV=test npm test -- --runInBand --coverage=false"]

[start]
cmd = "node express.js"
